# .github/workflows/update.yml
name: Hourly Sentiment Update

on:
  schedule:
    - cron: '0 * * * *'    # run every hour, on the hour
  workflow_dispatch:      # also allow manual “Run workflow” clicks

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your repository so the action can read/write files
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2) Set up Python 3.x
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3) Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) Run the update_sentiment.py script
      - name: Run sentiment updater
        run: python update_sentiment.py

      # 5) Commit any changed CSV files back to the repo
      - name: Commit updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sentiment_scores.csv
          git commit -m "hourly: update sentiment CSV" || echo "No changes to commit"
          git push
