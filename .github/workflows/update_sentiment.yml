name: hourly sentiment update

on:
  schedule:
    - cron: '0 * * * *'     # at minute 0 past every hour
  workflow_dispatch:       # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: run update_sentiment.py
        run: python update_sentiment.py

      - name: commit updated CSV
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add sentiment_hourly.csv
          git diff --cached --quiet || git commit -m "chore: hourly sentiment update"

      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
