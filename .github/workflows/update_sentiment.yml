name: hourly sentiment update

on:
  schedule:
    - cron: '0 * * * *'       # run at the top of every hour
  workflow_dispatch:          # allow manual runs

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run sentiment update
        run: |
          python update_sentiment.py

      - name: Commit & push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sentiment_scores.csv
          # only commit if there are changes
          git diff --quiet --exit-code || \
            git commit -m "chore: hourly sentiment_scores update"
          git push
