name: 🔄 Update sentiment CSV

# 1) Run on a schedule (every hour) and also manually via “Run workflow” button
on:
  schedule:
    # at minute 0 of every hour UTC
    - cron: '0 * * * *'
  workflow_dispatch:

# 2) Grant write access so we can push updated CSV back
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 3a) Check out your code
      - name: Checkout repo
        uses: actions/checkout@v3

      # 3b) Install Python and dependencies
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'    # or whichever you need
      - name: Install requirements
        run: pip install --upgrade pip && pip install -r requirements.txt

      # 3c) Run your sentiment-update script
      - name: Run update_sentiment.py
        run: python update_sentiment.py

      # 3d) Commit & push any changes to sentiment_scores.csv
      - name: Commit and push CSV
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: actions@github.com
          message: "chore: automated sentiment update [skip ci]"
          add: 'sentiment_scores.csv'
